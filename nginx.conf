# EL MASRIA — static site on nginx (Coolify Dockerfile build pack)
#
# Three jobs live here instead of in .htaccess (nginx ignores .htaccess entirely,
# so the 301 map used to be dead weight — the old indexed WordPress URLs
# returned 404 on the live site):
#   1. the 301 map from the old WordPress URLs to the new pages,
#   2. collapsing /index.html onto / so one page has exactly one URL,
#   3. keeping the staging host out of search results.
# The real domain, once its DNS points here, is indexed normally.

# --- 1) legacy WordPress URLs -> new pages, and /index.html -> / ------------
# The patterns are the %-encoded *request URIs* ($request_uri is NOT decoded),
# which keeps this file pure ASCII and immune to encoding/locale surprises.
# Source: crawl of the old wp-sitemap (5 indexed URLs).
#
# ⚠️ Why /index.html is collapsed HERE and not with
#    `location = /index.html { return 301 /; }`:
# `index index.html` makes nginx answer a request for `/` by INTERNALLY
# redirecting to `/index.html`, and an internal redirect re-runs location
# matching — so an `= /index.html` location would match that and 301 straight
# back to `/`, forever. $request_uri is the ORIGINAL request URI and internal
# redirects do not touch it, so keying on it here breaks the loop: a request
# for `/` still reads `/` and never matches this rule.
map $request_uri $legacy_redirect {
    default "";
    ~^/index\.html(\?|$)                                                           /;
    ~^/%D8%A7%D9%84%D8%AE%D8%AF%D9%85%D8%A7%D8%AA/?(\?|$)                          /services/;
    ~^/%D9%85%D9%86-%D9%86%D8%AD%D9%86/?(\?|$)                                      /about.html;
    ~^/%D8%A7%D8%AA%D8%B5%D9%84-%D8%A8%D9%86%D8%A7/?(\?|$)                          /contact.html;
    ~^/%D8%AE%D8%AF%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D8%AD%D9%85%D8%A7%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A%D8%A9/?(\?|$) /services/civil-defense.html;
}

# --- 3) staging stays out of the index --------------------------------------
# "all" on the real domain is equivalent to the default (index, follow).
map $host $robots_tag {
    default         "all";
    ~\.aidy\.site$  "noindex, nofollow";
    ~^localhost     "noindex, nofollow";
    ~^127\.0\.0\.1  "noindex, nofollow";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Emit RELATIVE Location headers. This container listens on plain :80 behind
    # Traefik, so nginx's $scheme is always "http" — an absolute redirect would
    # send an https visitor to http:// (confirmed on the live host: the legacy
    # /الخدمات/ redirect returned `Location: http://elmasria.aidy.site/services/`),
    # costing an extra hop and a scheme downgrade. Relative Location keeps
    # whatever scheme the visitor actually used.
    absolute_redirect off;

    if ($legacy_redirect) {
        return 301 $legacy_redirect;
    }

    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # ⚠️ add_header is NOT inherited into a location that declares its own
    # add_header, so the four headers above are repeated here on purpose.
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|xml|txt|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag $robots_tag always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
